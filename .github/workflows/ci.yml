name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    env:
      VG_HEADLESS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - run: python -m pytest -v

  build-windows:
    name: Build Windows executables
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --onefile --windowed --icon icon.ico --name VideoGrabber --collect-all playwright --add-data "ui.html;." gui.py
      - run: python -m PyInstaller --noconfirm --onefile --console --icon icon.ico --name video-grabber-cli --collect-all playwright download_video.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: |
            dist/VideoGrabber.exe
            dist/video-grabber-cli.exe
