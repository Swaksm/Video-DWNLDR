<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Grabber</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%2335479E'/%3E%3Cpath d='M24 17v30l25-15z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>window.SETTINGS = __SETTINGS__; window.SETUP_ONLY = __SETUP__;
if (window.SETUP_ONLY) document.documentElement.classList.add("setup-only");</script>
<script>
  (function () {
    var t = window.SETTINGS.theme;
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  :root {
    --bg: #FBFAF7; --card: #FFFFFF; --sunken: #F2F0EA;
    --text: #1C1D1F; --muted: #6B6A63; --faint: #A3A099;
    --border: #E7E4DB; --border-strong: #D5D1C4;
    --accent: #35479E; --accent-text: #FFFFFF; --accent-soft: rgba(53, 71, 158, .08);
    --err: #B6324A; --warn: #A6670F; --ok: #2F7D53;
    --shadow: 0 1px 2px rgba(28, 29, 31, .04);
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --head: "Archivo", "IBM Plex Sans", system-ui, sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #15161B; --card: #1C1E24; --sunken: #0F1013;
    --text: #ECE9E1; --muted: #9B998F; --faint: #6A6962;
    --border: #2B2D33; --border-strong: #3B3E46;
    --accent: #7E8DF2; --accent-text: #0F1013; --accent-soft: rgba(126, 141, 242, .12);
    --err: #E5677F; --warn: #D9993A; --ok: #5CBF8A;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
  body { min-height: 100vh; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 28px 20px 40px; display: flex; flex-direction: column; gap: 16px; }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .brand { display: flex; align-items: center; gap: 10px; font: 800 22px/1 var(--head); letter-spacing: -.01em; }
  .mark { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
  .mark svg { fill: var(--accent-text); }
  .tools { display: flex; align-items: center; gap: 10px; }

  .seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--muted); font: 600 12px var(--sans); padding: 6px 10px; cursor: pointer; }
  .seg button.on { background: var(--accent-soft); color: var(--accent); }
  .icon-btn { border: 1px solid var(--border-strong); background: var(--card); color: var(--muted); border-radius: 7px; width: 32px; height: 32px; cursor: pointer; display: grid; place-items: center; }
  .icon-btn:hover { color: var(--text); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 20px; }
  .card h2 { margin: 0; font: 700 15px/1.2 var(--head); letter-spacing: .01em; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .row { display: flex; gap: 10px; align-items: center; }
  .grow { flex: 1; min-width: 0; }

  label.field { display: block; font: 500 12px var(--sans); color: var(--muted); margin-bottom: 6px; }
  input[type=text], input[type=number] {
    width: 100%; background: var(--sunken); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 10px 12px; font: 14px var(--sans); outline: none;
  }
  input.mono { font-family: var(--mono); font-size: 13px; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input::placeholder { color: var(--faint); }

  button.btn {
    border: 1px solid var(--border-strong); background: var(--card); color: var(--text);
    border-radius: 7px; padding: 9px 14px; font: 600 13px var(--sans); cursor: pointer; white-space: nowrap;
  }
  button.btn:hover:not(:disabled) { border-color: var(--muted); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
  button.btn.link { border: 0; background: transparent; color: var(--accent); padding: 6px 4px; }
  button.btn:disabled { opacity: .45; cursor: not-allowed; }

  .opts { display: grid; grid-template-columns: 110px 1fr; gap: 14px; margin-top: 16px; }
  .opts2 { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  .tip { margin: 14px 0 0; color: var(--muted); font-size: 12.5px; }

  .switch { position: relative; width: 42px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; background: var(--border-strong); border-radius: 24px; transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(18px); }
  .switch-label { display: flex; align-items: center; gap: 10px; font-weight: 500; }

  .pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border-strong); border-radius: 999px; padding: 3px 10px; font: 600 12px var(--sans); color: var(--muted); }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.busy { color: var(--accent); border-color: var(--accent); }
  .pill.busy::before { animation: pulse 1s infinite; }
  .pill.ok { color: var(--ok); border-color: var(--ok); }
  .pill.err { color: var(--err); border-color: var(--err); }
  @keyframes pulse { 50% { opacity: .25; } }

  .list { border: 1px solid var(--border); border-radius: 7px; max-height: 300px; overflow-y: auto; background: var(--card); }
  .item { display: grid; grid-template-columns: 22px 64px 1fr 84px 64px; gap: 12px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .item:last-child { border-bottom: 0; }
  .item:hover { background: var(--accent-soft); }
  .item input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  .tag { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .04em; border: 1px solid var(--border-strong); border-radius: 5px; padding: 2px 6px; text-align: center; color: var(--text); }
  .tag.stream { color: var(--accent); border-color: var(--accent); }
  .name { min-width: 0; }
  .name b { display: block; font: 500 13px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name small { display: block; font: 400 11.5px var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .num { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
  .src { font-size: 12px; color: var(--muted); text-align: right; }
  .empty { padding: 36px 16px; text-align: center; color: var(--muted); }
  .empty b { display: block; color: var(--text); font: 700 15px var(--head); margin-bottom: 4px; }

  .bar { height: 6px; background: var(--sunken); border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 6px; transition: width .2s; }
  .bar.indet i { width: 30% !important; animation: slide 1.1s infinite ease-in-out; }
  @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  .meta { display: flex; justify-content: space-between; margin: 8px 0 14px; font: 500 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .log { background: var(--sunken); border: 1px solid var(--border); border-radius: 7px; padding: 12px; height: 150px; overflow-y: auto; font: 12px/1.6 var(--mono); color: var(--muted); white-space: pre-wrap; word-break: break-all; }
  .log .e { color: var(--err); } .log .o { color: var(--ok); }

  .foot { color: var(--faint); font-size: 12px; text-align: center; margin-top: 4px; }

  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 7px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .setup-only #app { display: none !important; }
  .setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
  .setrow > span:first-child { font-weight: 500; }
  .sep { border: 0; border-top: 1px solid var(--border); margin: 8px 0; }
  .small { font: 400 12px var(--mono); color: var(--muted); text-align: right; word-break: break-all; }
  button.btn.danger { color: var(--err); border-color: var(--err); }
  button.btn.danger.solid { background: var(--err); color: #fff; }
  .setup-only .wrap { max-width: 560px; padding-top: 9vh; }
  @media (max-width: 640px) {
    .item { grid-template-columns: 22px 54px 1fr 70px; } .src { display: none; }
    .opts { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 1.2v9.6L10.4 6z"/></svg></div>
      Video Grabber
    </div>
    <div class="tools">
      <button class="icon-btn" id="gearBtn" title="Settings" aria-label="Settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </header>

  <section class="card" id="settingsCard" style="display:none">
    <div class="card-head" style="margin-bottom:4px"><h2 data-i="set_title"></h2></div>
    <div class="setrow"><span data-i="set_language"></span>
      <div class="seg" id="langSeg"><button data-l="en">EN</button><button data-l="fr">FR</button></div></div>
    <div class="setrow"><span data-i="set_theme"></span>
      <div class="seg" id="themeSeg"><button data-th="light" data-i="th_light"></button><button data-th="dark" data-i="th_dark"></button></div></div>
    <div class="setrow"><span data-i="set_version"></span><span class="small" id="setVer"></span></div>
    <div id="setApp" style="display:none">
      <hr class="sep">
      <div class="setrow"><span data-i="set_location"></span><span class="small" id="setDir"></span></div>
      <div class="opts2" style="margin-top:4px">
        <label class="switch-label"><span class="switch"><input type="checkbox" id="gsDesktop"><span></span></span><span data-i="sc_desktop"></span></label>
        <label class="switch-label"><span class="switch"><input type="checkbox" id="gsStart"><span></span></span><span data-i="sc_start"></span></label>
        <span class="grow"></span>
        <span class="tip" id="gsMsg" style="margin:0"></span>
        <button class="btn" id="gsApply" data-i="sc_apply"></button>
      </div>
      <hr class="sep">
      <div class="setrow" id="unRow"><span class="small" style="text-align:left" data-i="set_uninstall_hint"></span><button class="btn danger" id="unBtn" data-i="set_uninstall"></button></div>
      <div id="unConfirm" style="display:none">
        <p class="tip" style="margin:4px 0 12px" data-i="set_uninstall_q"></p>
        <div class="row" style="justify-content:flex-end"><button class="btn" id="unCancel" data-i="set_cancel"></button><button class="btn danger solid" id="unGo" data-i="set_uninstall_go"></button></div>
      </div>
    </div>
  </section>

  <section class="card" id="scCard" style="display:none">
    <div class="card-head" style="margin-bottom:6px"><h2 id="scTitle"></h2></div>
    <p class="tip" style="margin:0 0 14px" id="scText"></p>
    <div id="scForm">
    <label class="field" for="scDir" data-i="sc_location"></label>
    <div class="row" style="margin-bottom:14px">
      <input id="scDir" type="text" class="mono grow" spellcheck="false">
      <button class="btn" id="scBrowse" data-i="browse"></button>
    </div>
    <div class="opts2" style="margin-top:0">
      <label class="switch-label"><span class="switch"><input type="checkbox" id="scDesktop" checked><span></span></span><span data-i="sc_desktop"></span></label>
      <label class="switch-label"><span class="switch"><input type="checkbox" id="scStart" checked><span></span></span><span data-i="sc_start"></span></label>
      <span class="grow"></span>
      <span id="scMsg" class="tip" style="margin:0"></span>
      <button class="btn" id="scLater"></button>
      <button class="btn primary" id="scApply"></button>
    </div>
    </div>
    <div id="scDone" class="opts2" style="display:none;margin-top:0">
      <span class="grow"></span>
      <button class="btn" id="scClose"></button>
      <button class="btn primary" id="scLaunch"></button>
    </div>
  </section>

  <div id="app">
  <section class="card">
    <div class="row">
      <div class="grow">
        <label class="field" for="url" data-i="url_label"></label>
        <input id="url" type="text" class="mono" placeholder="https://" autocomplete="off" spellcheck="false">
      </div>
      <button class="btn primary" id="scanBtn" style="align-self:flex-end;height:41px"></button>
    </div>
    <div class="opts">
      <div>
        <label class="field" for="wait" data-i="wait_label"></label>
        <input id="wait" type="number" min="5" max="300" value="20" class="mono">
      </div>
      <div>
        <label class="field" for="out" data-i="out_label"></label>
        <div class="row"><input id="out" type="text" class="mono grow" spellcheck="false"><button class="btn" id="outBrowse" data-i="browse" style="display:none"></button></div>
      </div>
    </div>
    <div class="opts2">
      <label class="switch-label">
        <span class="switch"><input type="checkbox" id="cdpOn"><span></span></span>
        <span data-i="use_cdp"></span>
      </label>
      <input id="cdp" type="text" class="mono" value="http://localhost:9222" style="width:240px;display:none">
    </div>
    <p class="tip" data-i="tip"></p>
  </section>

  <section class="card">
    <div class="card-head">
      <div class="row"><h2 data-i="videos"></h2><span class="pill" id="countPill"></span></div>
      <div class="row">
        <button class="btn link" id="allBtn"></button>
        <button class="btn primary" id="dlBtn"></button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <div class="row"><h2 data-i="activity"></h2><span class="pill" id="phasePill"></span></div>
      <button class="btn" id="folderBtn"></button>
    </div>
    <div class="bar" id="bar"><i></i></div>
    <div class="meta"><span id="metaL"></span><span id="metaR"></span></div>
    <div class="log" id="log"></div>
  </section>

  <div class="foot" data-i="disclaimer"></div>
  </div>
</div>

<script>
const TOKEN = "__TOKEN__";
const I18N = {
  en: {
    url_label: "Page URL", scan: "Scan page", wait_label: "Scan time (s)", out_label: "Save to",
    use_cdp: "Attach to my Chrome (--cdp)", tip: "If Cloudflare shows a captcha, solve it in the browser window that opens, then press play on the video.",
    videos: "Videos", select_all: "Select all", download: "Download selected", activity: "Activity", open_folder: "Open folder",
    empty_t: "No videos yet", empty_s: "Paste a page URL and scan it.", hls: "Stream",
    src_net: "network", src_dom: "page", n_found: "{n} found", n_sel: "{n} selected",
    ph_ready: "Ready", ph_scanning: "Scanning", ph_downloading: "Downloading", ph_done: "Done", ph_error: "Error",
    need_url: "Enter a page URL first.", need_sel: "Select at least one video.",
    disclaimer: "Only download content you are allowed to. You are responsible for site terms and copyright.",
    browse: "Browse...",
    sc_title_install: "Install Video Grabber", sc_text_install: "Choose where to install it and how to find it again. No admin rights needed.",
    sc_title_manage: "Shortcuts", sc_text_manage: "Video Grabber is installed in {n}. You can uninstall it from Windows Settings > Apps.",
    sc_location: "Install location", sc_desktop: "Desktop shortcut", sc_start: "Start menu",
    sc_install: "Install", sc_apply: "Apply", sc_close: "Close",
    set_title: "Settings", set_language: "Language", set_theme: "Theme", th_light: "Light", th_dark: "Dark", set_version: "Version",
    set_location: "Installed in", set_uninstall: "Uninstall", set_uninstall_hint: "Remove Video Grabber from this PC. Your downloaded videos are kept.",
    set_uninstall_q: "Remove Video Grabber, its shortcuts and its settings? Your downloaded videos will not be deleted.",
    set_cancel: "Cancel", set_uninstall_go: "Yes, uninstall", set_uninstalling: "Uninstalling...",
    sc_done: "Done", sc_work: "Working...", sc_finished: "Video Grabber is installed",
    sc_text_done: "Installed in {n}. You can delete the downloaded file. Find it in the Start menu or on your desktop.", sc_launch: "Launch Video Grabber"
  },
  fr: {
    url_label: "URL de la page", scan: "Analyser la page", wait_label: "Durée (s)", out_label: "Enregistrer dans",
    use_cdp: "Utiliser mon Chrome (--cdp)", tip: "Si Cloudflare affiche un captcha, résous-le dans la fenêtre du navigateur qui s'ouvre, puis lance la lecture de la vidéo.",
    videos: "Vidéos", select_all: "Tout sélectionner", download: "Télécharger la sélection", activity: "Activité", open_folder: "Ouvrir le dossier",
    empty_t: "Aucune vidéo", empty_s: "Colle l'URL d'une page et analyse-la.", hls: "Flux",
    src_net: "réseau", src_dom: "page", n_found: "{n} trouvée(s)", n_sel: "{n} sélectionnée(s)",
    ph_ready: "Prêt", ph_scanning: "Analyse", ph_downloading: "Téléchargement", ph_done: "Terminé", ph_error: "Erreur",
    need_url: "Saisis d'abord l'URL d'une page.", need_sel: "Sélectionne au moins une vidéo.",
    disclaimer: "Ne télécharge que du contenu autorisé. Tu es responsable des conditions des sites et du droit d'auteur.",
    browse: "Parcourir...",
    sc_title_install: "Installer Video Grabber", sc_text_install: "Choisis où l'installer et comment le retrouver. Aucun droit administrateur requis.",
    sc_title_manage: "Raccourcis", sc_text_manage: "Video Grabber est installé dans {n}. Tu peux le désinstaller depuis Paramètres Windows > Applications.",
    sc_location: "Emplacement d'installation", sc_desktop: "Raccourci bureau", sc_start: "Menu Démarrer",
    sc_install: "Installer", sc_apply: "Appliquer", sc_close: "Fermer",
    set_title: "Réglages", set_language: "Langue", set_theme: "Thème", th_light: "Clair", th_dark: "Sombre", set_version: "Version",
    set_location: "Installé dans", set_uninstall: "Désinstaller", set_uninstall_hint: "Retire Video Grabber de ce PC. Tes vidéos téléchargées sont conservées.",
    set_uninstall_q: "Supprimer Video Grabber, ses raccourcis et ses réglages ? Tes vidéos téléchargées ne seront pas supprimées.",
    set_cancel: "Annuler", set_uninstall_go: "Oui, désinstaller", set_uninstalling: "Désinstallation...",
    sc_done: "Terminé", sc_work: "En cours...", sc_finished: "Video Grabber est installé",
    sc_text_done: "Installé dans {n}. Tu peux supprimer le fichier téléchargé. Retrouve-le dans le menu Démarrer ou sur le bureau.", sc_launch: "Lancer Video Grabber"
  }
};
const $ = (s) => document.querySelector(s);
const SET = window.SETTINGS || {};
const save = (k, v) => { SET[k] = v; api("/api/settings", { [k]: v }).catch(() => {}); };
let lang = SET.lang || "en";
let S = { phase: "ready", busy: false, items: [], version: -1, done: 0, total: 0 };
let sel = new Set(), logNext = 0, shownVersion = -2;

const t = (k, v) => (I18N[lang][k] || k).replace("{n}", v);
const human = (n) => { if (!n) return "—"; const u = ["B","KB","MB","GB"]; let i = 0; while (n >= 1024 && i < 3) { n /= 1024; i++; } return n.toFixed(i ? 1 : 0) + " " + u[i]; };

async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "X-Token": TOKEN, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  return r.json();
}

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach((e) => (e.textContent = t(e.dataset.i)));
  $("#scanBtn").textContent = t("scan"); $("#allBtn").textContent = t("select_all");
  $("#dlBtn").textContent = t("download"); $("#folderBtn").textContent = t("open_folder");
  setupTexts();
  document.querySelectorAll("#langSeg button").forEach((b) => b.classList.toggle("on", b.dataset.l === lang));
  shownVersion = -2; render();
}

function render() {
  const busy = S.busy;
  $("#scanBtn").disabled = busy; $("#dlBtn").disabled = busy || !sel.size;
  const pill = $("#phasePill");
  pill.textContent = t("ph_" + S.phase);
  pill.className = "pill " + ({ scanning: "busy", downloading: "busy", done: "ok", error: "err" }[S.phase] || "");
  const cp = $("#countPill");
  cp.textContent = sel.size ? t("n_sel", sel.size) : t("n_found", S.items.length);

  if (shownVersion !== S.version) {
    shownVersion = S.version;
    const list = $("#list"); list.textContent = "";
    if (!S.items.length) {
      const e = document.createElement("div"); e.className = "empty";
      const b = document.createElement("b"); b.textContent = t("empty_t");
      e.append(b, t("empty_s")); list.append(e);
    }
    for (const it of S.items) {
      const row = document.createElement("label"); row.className = "item";
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = sel.has(it.id);
      cb.onchange = () => { cb.checked ? sel.add(it.id) : sel.delete(it.id); render(); };
      const tag = document.createElement("span"); tag.className = "tag" + (it.kind === "manifest" ? " stream" : "");
      tag.textContent = it.kind === "manifest" ? t("hls") : (it.ext || "?");
      const nm = document.createElement("div"); nm.className = "name"; nm.title = it.url;
      const b = document.createElement("b"); b.textContent = it.name;
      const s = document.createElement("small"); s.textContent = it.url;
      nm.append(b, s);
      const sz = document.createElement("span"); sz.className = "num"; sz.textContent = human(it.size);
      const sr = document.createElement("span"); sr.className = "src"; sr.textContent = t(it.source === "source_dom" ? "src_dom" : "src_net");
      row.append(cb, tag, nm, sz, sr); list.append(row);
    }
  }
  const bar = $("#bar");
  const dl = S.phase === "downloading";
  bar.classList.toggle("indet", dl && !S.total);
  bar.firstElementChild.style.width = dl && S.total ? (S.done / S.total * 100) + "%" : (S.phase === "done" ? "100%" : "0");
  $("#metaL").textContent = dl ? human(S.done) + (S.total ? " / " + human(S.total) : "") : "";
  $("#metaR").textContent = dl && S.total ? (S.done / S.total * 100).toFixed(1) + " %" : "";
}

function addLog(line) {
  const box = $("#log"), d = document.createElement("div");
  d.textContent = line;
  if (line.startsWith("[x]")) d.className = "e"; else if (line.startsWith("[+]")) d.className = "o";
  box.append(d); box.scrollTop = box.scrollHeight;
}

async function poll() {
  try {
    const s = await api("/api/state?since=" + logNext);
    const newScan = s.version !== S.version;
    S = s; logNext = s.next;
    s.logs.forEach(addLog);
    if (newScan) { sel = new Set(S.items.length ? [S.items[0].id] : []); shownVersion = -2; }
    if (!$("#out").value) $("#out").value = s.default_out;
    initInstall(s);
    render();
  } catch (e) {}
  setTimeout(poll, 500);
}

$("#scanBtn").onclick = async () => {
  const url = $("#url").value.trim();
  if (!url) return addLog("[x] " + t("need_url"));
  save("out", $("#out").value);
  save("wait", +$("#wait").value || 20);
  await api("/api/scan", { url, lang, wait: +$("#wait").value || 20, cdp: $("#cdpOn").checked ? $("#cdp").value : null });
};
$("#url").addEventListener("keydown", (e) => { if (e.key === "Enter" && !S.busy) $("#scanBtn").click(); });
$("#dlBtn").onclick = async () => {
  if (!sel.size) return addLog("[x] " + t("need_sel"));
  save("out", $("#out").value);
  await api("/api/download", { ids: [...sel], out: $("#out").value, lang });
};
$("#allBtn").onclick = () => { sel = new Set(S.items.map((i) => i.id)); shownVersion = -2; render(); };
$("#folderBtn").onclick = () => api("/api/open-folder", { out: $("#out").value });
$("#cdpOn").onchange = (e) => { $("#cdp").style.display = e.target.checked ? "" : "none"; };
const markTheme = () => document.querySelectorAll("#themeSeg button").forEach((b) =>
  b.classList.toggle("on", b.dataset.th === document.documentElement.getAttribute("data-theme")));
document.querySelectorAll("#themeSeg button").forEach((b) => (b.onclick = () => {
  document.documentElement.setAttribute("data-theme", b.dataset.th); save("theme", b.dataset.th); markTheme();
}));
document.querySelectorAll("#langSeg button").forEach((b) => (b.onclick = () => { lang = b.dataset.l; save("lang", lang); applyLang(); }));

let inst = null, canBrowse = false, setupChecked = false, finishedDir = null;
const setupOnly = !!window.SETUP_ONLY;
const installed = () => !!(inst && inst.dir);

function setupTexts() {
  if (!inst) return;
  $("#scClose").textContent = t("sc_close"); $("#scLaunch").textContent = t("sc_launch");
  if (finishedDir) { $("#scTitle").textContent = t("sc_finished"); $("#scText").textContent = t("sc_text_done", finishedDir); return; }
  $("#scTitle").textContent = t(installed() ? "sc_title_manage" : "sc_title_install");
  $("#scText").textContent = installed() ? t("sc_text_manage", inst.dir) : t("sc_text_install");
  $("#scApply").textContent = t(installed() ? "sc_apply" : "sc_install");
  $("#scLater").textContent = t("sc_close");
  $("#scLater").style.display = setupOnly ? "none" : "";
}
function openSetup() {
  const sc = inst.shortcuts || {};
  $("#scDir").value = inst.dir || inst.default_dir;
  $("#scDir").readOnly = installed();
  $("#scBrowse").style.display = canBrowse && !installed() ? "" : "none";
  $("#scDesktop").checked = installed() ? !!sc.Desktop : true;
  $("#scStart").checked = installed() ? !!sc.Start : true;
  $("#scMsg").textContent = "";
  setupTexts();
  $("#scCard").style.display = "";
}
function initInstall(s) {
  inst = s.install; canBrowse = s.can_browse;
  $("#outBrowse").style.display = canBrowse ? "" : "none";
  if (!inst.can || !inst.shortcuts) return;
  if (!setupChecked) { setupChecked = true; if (setupOnly) openSetup(); }
  setupTexts();
}
$("#scLater").onclick = () => { $("#scCard").style.display = "none"; };
$("#scClose").onclick = () => api("/api/quit", {});
$("#scLaunch").onclick = async () => {
  const r = await api("/api/launch", {});
  if (!r.ok) $("#scText").textContent = "[x] error";
};
$("#scBrowse").onclick = async () => { const r = await api("/api/pick-folder", { initial: $("#scDir").value }); if (r.path) $("#scDir").value = r.path; };
$("#outBrowse").onclick = async () => { const r = await api("/api/pick-folder", { initial: $("#out").value }); if (r.path) { $("#out").value = r.path; save("out", r.path); } };
$("#scApply").onclick = async () => {
  $("#scMsg").textContent = t("sc_work"); $("#scApply").disabled = true;
  let r = {};
  try { r = await api("/api/install", { dir: $("#scDir").value, desktop: $("#scDesktop").checked, start: $("#scStart").checked }); } catch (e) {}
  $("#scApply").disabled = false;
  if (!r.ok) { $("#scMsg").textContent = "[x] " + (r.error || "error"); return; }
  if (setupOnly) {
    finishedDir = r.dir; $("#scForm").style.display = "none"; $("#scDone").style.display = ""; setupTexts();
    return;
  }
  $("#scMsg").textContent = t("sc_done");
  setTimeout(() => { $("#scMsg").textContent = ""; $("#scCard").style.display = "none"; }, 1500);
};

function fillSettings() {
  markTheme();
  $("#setVer").textContent = inst ? inst.version : "";
  const on = !!(inst && inst.can && installed());
  $("#setApp").style.display = on ? "" : "none";
  if (!on) return;
  $("#setDir").textContent = inst.dir;
  const sc = inst.shortcuts || {};
  $("#gsDesktop").checked = !!sc.Desktop; $("#gsStart").checked = !!sc.Start;
  $("#gsMsg").textContent = ""; $("#unConfirm").style.display = "none"; $("#unRow").style.display = "";
}
$("#gearBtn").onclick = () => {
  const c = $("#settingsCard"); const open = c.style.display === "none";
  c.style.display = open ? "" : "none";
  if (open) fillSettings();
};
$("#gsApply").onclick = async () => {
  $("#gsMsg").textContent = t("sc_work"); $("#gsApply").disabled = true;
  let r = {};
  try { r = await api("/api/install", { dir: inst.dir, desktop: $("#gsDesktop").checked, start: $("#gsStart").checked }); } catch (e) {}
  $("#gsApply").disabled = false;
  $("#gsMsg").textContent = r.ok ? t("sc_done") : "[x] " + (r.error || "error");
  setTimeout(() => { $("#gsMsg").textContent = ""; }, 2000);
};
$("#unBtn").onclick = () => { $("#unConfirm").style.display = ""; $("#unRow").style.display = "none"; };
$("#unCancel").onclick = () => { $("#unConfirm").style.display = "none"; $("#unRow").style.display = ""; };
$("#unGo").onclick = async () => {
  $("#unGo").disabled = true; $("#unCancel").disabled = true;
  $("#unConfirm").querySelector("p").textContent = t("set_uninstalling");
  await api("/api/uninstall", {});
};

$("#out").value = SET.out || "";
if (SET.wait) $("#wait").value = SET.wait;
applyLang(); poll();
</script>
</body>
</html>
